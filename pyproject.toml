[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "visionlabel"
version = "0.1.0"
description = "Local rectangle annotation with immutable server revisions"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "dearpygui>=2.1,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "mypy==1.15.0", "jsonschema>=4.23,<5"]

[project.scripts]
visionlabel = "visionlabel.desktop:main"
datatracking = "visionlabel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/visionlabel"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "visionlabel/THIRD_PARTY_NOTICES.md"
"docs/license_inventory" = "visionlabel/license_inventory"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"] # FastAPI dependency defaults are intentional.

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
